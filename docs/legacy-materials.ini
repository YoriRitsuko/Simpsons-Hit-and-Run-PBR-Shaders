; Section names are exact Pure3D Shader chunk names, ignoring case.
; The stock Family Sedan uses this spelling.
[Windsheild_m]
Mode=Glass
Reflection=0.55

; Optional demo glow override. Keeps the shiny housing's maps and alpha.
; [PBRPreviewBody_m]
; EmissiveStrength=2.5

; PBR example. Blended meshes need an alpha-enabled Pure3D material.
; [my_pbr_material_m]
; Mode=PBR
; BaseColor=my_base_color.tga
; NormalMap=my_normal.tga
; ORM=my_orm.tga
; EmissiveMap=my_emission.tga
; Environment=my_prefiltered_mirrorball.dds
; AlphaMode=Opaque
; AlphaCutoff=0.5
; Opacity=1.0
; Roughness=0.5
; Metallic=0.0
; Exposure=1.0
; These multiply the PBR strengths from PBR Shaders' Mod Settings.
; DirectLightStrength=1.0
; EnvironmentStrength=1.0
; EmissiveStrength=1.0

; Example for an authored paint material with position, normals, UV0 and RGBA.
; Replace the section name and place your Maps next to this INI.
; [my_car_body_m]
; Mode=Paint
; NormalMap=my_car_normal.tga
; SphereMap=my_sphere.tga
; PaintColour=4080EB
; MaskSet=0
; NormalStrength=1.0
; Reflection=0.55
